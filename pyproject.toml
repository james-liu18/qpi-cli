[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qpi-cli"
dynamic = ["version"]
description = "QuecPi QCS6490 (PI H1) Yocto Linux SDK 命令行工具 (构建 / 打包 / 烧录)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Quectel Pi" }]
keywords = ["quectel", "quecpi", "qpi", "qcs6490", "yocto", "sdk", "bitbake", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/james-liu18/qpi-cli"
Repository = "https://github.com/james-liu18/qpi-cli"
"Bug Tracker" = "https://github.com/james-liu18/qpi-cli/issues"
"SDK (Pi-H1-Linux-SDK)" = "https://github.com/Quectel-Pi/Pi-H1-Linux-SDK"

[project.scripts]
qpi-cli = "qpi_cli.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "qpi_cli.__version__" }
